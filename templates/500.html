<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroare de server | Andreea Sandu</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1C1613;
            color: #F5EEE4;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .wrap { max-width: 32rem; padding: 24px; }
        p.eyebrow {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #FF7A57;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 24px;
            background: linear-gradient(90deg, #E85C3B, #FF7A57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.desc { color: #A79A8C; font-size: 1.1rem; line-height: 1.6; margin-bottom: 36px; }
        a.btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #E85C3B, #FF7A57);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="eyebrow">Eroare 500</p>
        <h1>Ceva n-a mers bine</h1>
        <p class="desc">A apărut o eroare neașteptată pe acest server. Te rog încearcă din nou peste puțin timp.</p>
        <a class="btn" href="/">Înapoi acasă</a>
    </div>
</body>
</html>
