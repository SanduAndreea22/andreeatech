<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Andreea Sandu</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #020617;
            color: #f1f5f9;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .wrap { max-width: 32rem; padding: 24px; }
        p.eyebrow {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #60a5fa;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 24px;
            background: linear-gradient(90deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.desc { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 36px; }
        a.btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="eyebrow">Error 500</p>
        <h1>Something went wrong</h1>
        <p class="desc">An unexpected error occurred on this server. Please try again in a moment.</p>
        <a class="btn" href="/">Back to home</a>
    </div>
</body>
</html>
