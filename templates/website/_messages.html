{% if messages %}
    {% for message in messages %}
    <div class="form-message {% if message.tags == 'error' %}form-message-error{% else %}form-message-success{% endif %}">
        {% if message.tags == 'error' %}
        <svg class="form-message-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        {% else %}
        <svg class="form-message-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        {% endif %}
        {{ message }}
    </div>
    {% endfor %}
{% endif %}
