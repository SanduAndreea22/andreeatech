{% with current=request.resolver_match.url_name %}
<header class="nav">
    <div class="wrap">
        <div class="nav-in">
            <a class="brand" href="{% url 'home' %}" aria-label="Andreea Tech, acasă">Andreea <i>Tech</i></a>
            <nav class="nav-links" aria-label="Principal">
                <a href="{% url 'services' %}"{% if current == 'services' or current == 'service_detail' %} aria-current="page"{% endif %}>Servicii</a>
                <a href="{% url 'projects' %}"{% if current == 'projects' or current == 'project_detail' %} aria-current="page"{% endif %}>Portofoliu</a>
                <a href="{% url 'products' %}"{% if current == 'products' or current == 'planner_product' or current == 'budget_product' %} aria-current="page"{% endif %}>Produse proprii</a>
                <a href="{% url 'about' %}"{% if current == 'about' %} aria-current="page"{% endif %}>Despre</a>
                <a href="{% url 'contact' %}"{% if current == 'contact' %} aria-current="page"{% endif %}>Contact</a>
                <a class="btn btn-primary" href="{% url 'start_project' %}">Cere o ofertă</a>
            </nav>
            <button class="theme-toggle" type="button" id="themeToggle" aria-pressed="false" aria-label="Schimbă tema: întunecat" hidden>

                <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <details class="menu">
                <summary>Meniu</summary>
                <nav class="menu-panel" aria-label="Meniu mobil">
                    <a href="{% url 'home' %}"{% if current == 'home' %} aria-current="page"{% endif %}>Acasă</a>
                    <a href="{% url 'services' %}"{% if current == 'services' or current == 'service_detail' %} aria-current="page"{% endif %}>Servicii</a>
                    <a href="{% url 'projects' %}"{% if current == 'projects' or current == 'project_detail' %} aria-current="page"{% endif %}>Portofoliu</a>
                    <a href="{% url 'products' %}"{% if current == 'products' or current == 'planner_product' or current == 'budget_product' %} aria-current="page"{% endif %}>Produse proprii</a>
                    <a href="{% url 'about' %}"{% if current == 'about' %} aria-current="page"{% endif %}>Despre</a>
                    <a href="{% url 'contact' %}"{% if current == 'contact' %} aria-current="page"{% endif %}>Contact</a>
                    <a class="menu-cta" href="{% url 'start_project' %}">Cere o ofertă</a>
                </nav>
            </details>
        </div>
    </div>
</header>
{% endwith %}
